[project]
name = "sport-app"
version = "1.0.0"
description = "Application de gestion de résultats sportifs — Projet ENSAI 2025/2026"
readme = "README.md"
requires-python = "==3.11.7"
license = { file = "LICENSE" }

# Dépendances runtime (versions exactes)
dependencies = [
    "pandas==2.2.1",
    "numpy==1.26.4",
    "python-dateutil==2.9.0.post0",
    "streamlit==1.32.0",
    "orjson==3.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "ruff==0.4.2"
]

# ============================================================
# Ruff — linter et formatter
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "output",
    "datasets",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # lignes longues (gérées par le formatter)
    "B008",  # appels de fonctions dans valeurs par défaut
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

# ============================================================
# Couverture de code
# ============================================================

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/ui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
]
show_missing = true
precision = 1
